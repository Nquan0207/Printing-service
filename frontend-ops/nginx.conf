server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The API and the media proxy must stay same-origin with the SPA: the
    # image paths products return are relative (/media/...), and keeping one
    # origin means no CORS and no URL rewriting in the client.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # X-Stockroom-User is forwarded automatically with the request headers.
    }

    location /media/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        # Objects are content-addressed, so they can be cached hard.
        proxy_cache_valid 200 30d;
    }

    # Hashed build assets never change content under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing: /shop, /admin and /orders are React routes, not
    # files, so anything unmatched falls back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
