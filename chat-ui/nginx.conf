server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # POST /api/chat is a Server-Sent Events stream. Buffering would hold the
    # whole model response until it finished, so tokens would arrive in one
    # lump instead of streaming -- proxy_buffering off is load-bearing here.
    location /api/ {
        proxy_pass http://chat:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        # A slow local model on CPU can take minutes to answer.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # The chat service proxies these on to the Go API, which is what keeps the
    # relative /media/... paths in tool results resolvable from this origin.
    location /media/ {
        proxy_pass http://chat:3002;
        proxy_set_header Host $host;
        proxy_cache_valid 200 30d;
    }

    location = /healthz {
        proxy_pass http://chat:3002/healthz;
        proxy_set_header Host $host;
    }

    # Hashed build assets never change content under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
