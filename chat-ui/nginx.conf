server {
    listen 8080 default_server;
    server_name 127.0.0.1;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # A literal hostname in proxy_pass is resolved once, when the config loads,
    # and cached for the life of the process -- so recreating the `chat`
    # container hands it a new IP and every proxied request 502s until nginx is
    # restarted too. Resolving through Docker's embedded DNS (127.0.0.11) with
    # the upstream held in a variable defers the lookup to request time.
    #
    # proxy_pass with a variable and no URI part forwards the original request
    # URI unchanged, which is what all three locations below want.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $chat_upstream "chat:3002";

    # POST /api/chat is a Server-Sent Events stream. Buffering would hold the
    # whole model response until it finished, so tokens would arrive in one
    # lump instead of streaming -- proxy_buffering off is load-bearing here.
    location /api/ {
        proxy_pass http://$chat_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        # A slow local model on CPU can take minutes to answer.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # The chat service proxies these on to the Go API, which is what keeps the
    # relative /media/... paths in tool results resolvable from this origin.
    location /media/ {
        proxy_pass http://$chat_upstream;
        proxy_set_header Host $http_host;
        proxy_cache_valid 200 30d;
    }

    location = /healthz {
        proxy_pass http://$chat_upstream;
        proxy_set_header Host $http_host;
    }

    # Hashed build assets never change content under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Always pick up the latest hashed asset names after a container rebuild.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}

# Same host port, separate browser origin: localhost vs 127.0.0.1.
server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    location = /sandbox.js {
        add_header Cache-Control "no-store";
    }
    location = /sandbox/ {
        try_files /sandbox.html =404;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; frame-src 'self'; img-src data: blob: http://127.0.0.1:8080; font-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'" always;
        add_header Cache-Control "no-store";
    }
    location / { return 404; }
}
