services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: stockroom
      POSTGRES_DB: stockroom
      POSTGRES_USER: raksul
      POSTGRES_PASSWORD: raksul_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - stockroom_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./go-backend
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      STOCKROOM_ADDR: "0.0.0.0:8080"
      STOCKROOM_DATABASE_URL: "postgresql://raksul:raksul_password@postgres:5432/stockroom"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: stockroom-media
      MINIO_SECURE: "false"
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raksul -d stockroom"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Product image objects for the stockroom PoC. Loopback only, no public
  # bucket policy -- the Go service is the only reader, via GET /media/{key}.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # web console
    volumes:
      - raksul_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Go API. Inside the container it binds 0.0.0.0 so Docker can reach it, but
  # the published port is scoped to 127.0.0.1 -- so the service is still
  # unreachable from outside this machine, which is what the contract's
  # loopback-only requirement actually means.
  api:
    build: ./backend-ops
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      STOCKROOM_ADDR: "0.0.0.0:8080"
      # Gates the customer-facing shop. Flip with SHOP_ENABLED=false in the
      # host environment, then `docker compose up -d api` -- no rebuild.
      SHOP_ENABLED: "${SHOP_ENABLED:-true}"
      # debug also logs /healthz and /media, which are filtered at info.
      STOCKROOM_LOG_LEVEL: "${STOCKROOM_LOG_LEVEL:-info}"
      # "*" allows any origin. Safe only while the port is loopback-bound.
      STOCKROOM_CORS_ORIGIN: "${STOCKROOM_CORS_ORIGIN:-*}"
      STOCKROOM_ADMIN_EMAILS: "${STOCKROOM_ADMIN_EMAILS:-admin@stockroom.local}"
      STOCKROOM_DATABASE_URL: "postgresql://raksul:raksul_password@postgres:5432/stockroom"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: stockroom-media
      MINIO_SECURE: "false"
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  # SPA served by nginx, which also reverse-proxies /api and /media to the api
  # service so the browser sees one origin (no CORS, and the relative /media
  # paths in product responses resolve unchanged).
  web:
    build: ./frontend-ops
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:8080"
    restart: unless-stopped

  # MCP Apps server (Python). Read-only admin ops tools + ui:// Views that a
  # host renders in a sandboxed iframe. Talks to `api` over HTTP; never to
  # Postgres or MinIO directly.
  mcp:
    build: ./mcp-ops
    depends_on:
      api:
        condition: service_healthy
    environment:
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "3001"
      STOCKROOM_API_BASE: "http://api:8080"
      STOCKROOM_ADMIN_EMAIL: "${STOCKROOM_ADMIN_EMAIL:-admin@stockroom.local}"
    ports:
      - "127.0.0.1:3001:3001"
    restart: unless-stopped

  # One-shot tool, not a service -- `profiles` keeps `docker compose up` from
  # starting it. Run it explicitly:
  #   docker compose run --rm crawler init-db
  #   docker compose run --rm crawler crawl
  crawler:
    build:
      context: .
      dockerfile: crawler/Dockerfile
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      STOCKROOM_DATABASE_URL: "postgresql://raksul:raksul_password@postgres:5432/stockroom"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: stockroom-media
      MINIO_SECURE: "false"
      CRAWL_MAX_PRODUCTS: "${CRAWL_MAX_PRODUCTS:-70}"
      CRAWL_MAX_CATEGORIES: "${CRAWL_MAX_CATEGORIES:-8}"

volumes:
  raksul_postgres_data:
  raksul_minio_data:
