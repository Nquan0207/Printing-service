services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: raksul_db
      POSTGRES_USER: raksul
      POSTGRES_PASSWORD: raksul_password
    ports:
      - "5432:5432"
    volumes:
      - raksul_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raksul -d raksul_db"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  raksul_postgres_data:

