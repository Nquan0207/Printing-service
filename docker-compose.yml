services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: stockroom
      POSTGRES_USER: raksul
      POSTGRES_PASSWORD: raksul_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - raksul_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raksul -d stockroom"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Product image objects for the stockroom PoC. Loopback only, no public
  # bucket policy -- the Go service is the only reader, via GET /media/{key}.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # web console
    volumes:
      - raksul_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  raksul_postgres_data:
  raksul_minio_data:
