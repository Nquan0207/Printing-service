x-storage-env: &storage-env
  STOCKROOM_DATABASE_URL: postgresql://raksul:raksul_password@postgres:5432/stockroom
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: minioadmin
  MINIO_BUCKET: stockroom-media
  MINIO_SECURE: "false"

x-crawler: &crawler
  build:
    context: .
    dockerfile: crawler/Dockerfile
  environment: &crawler-env
    <<: *storage-env
    CRAWL_MAX_PRODUCTS: "${CRAWL_MAX_PRODUCTS:-150}"
    CRAWL_MAX_CATEGORIES: "${CRAWL_MAX_CATEGORIES:-10}"
    CRAWL_CATEGORIES: "${CRAWL_CATEGORIES:-}"
    CRAWL_SIZES_PER_PRODUCT: "${CRAWL_SIZES_PER_PRODUCT:-3}"
    CRAWL_MAX_IMAGES: "${CRAWL_MAX_IMAGES:-3}"
    CRAWL_REQUEST_DELAY: "${CRAWL_REQUEST_DELAY:-1.25}"

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: stockroom
      POSTGRES_USER: raksul
      POSTGRES_PASSWORD: raksul_password
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"]
    volumes: ["raksul_postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U raksul -d stockroom"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:${MINIO_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes: ["raksul_minio_data:/data"]
    healthcheck:
      test: [CMD-SHELL, "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend-ops
      target: runtime
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
    environment:
      <<: *storage-env
      STOCKROOM_ADDR: 0.0.0.0:8080
      SHOP_ENABLED: "${SHOP_ENABLED:-true}"
      STOCKROOM_LOG_LEVEL: "${STOCKROOM_LOG_LEVEL:-info}"
      STOCKROOM_CORS_ORIGIN: "${STOCKROOM_CORS_ORIGIN:-*}"
      STOCKROOM_ADMIN_EMAILS: "${STOCKROOM_ADMIN_EMAILS:-admin@stockroom.local}"
    ports: ["127.0.0.1:${API_HOST_PORT:-8080}:8080"]
    restart: unless-stopped

  web:
    build: ./frontend-ops
    depends_on:
      api: {condition: service_healthy}
    ports: ["127.0.0.1:${WEB_HOST_PORT:-3000}:8080"]
    restart: unless-stopped

  mcp:
    container_name: "${ADMIN_MCP_CONTAINER_NAME:-stockroom-admin-mcp}"
    build: ./mcp-ops
    depends_on:
      api: {condition: service_healthy}
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: "3001"
      STOCKROOM_API_BASE: http://api:8080
      STOCKROOM_PUBLIC_API_BASE: "http://127.0.0.1:${API_HOST_PORT:-8080}"
      STOCKROOM_ADMIN_EMAIL: "${STOCKROOM_ADMIN_EMAIL:-admin@stockroom.local}"
      # Checked against the sign-in form inside the admin panel. Change it.
      STOCKROOM_ADMIN_PASSCODE: "${STOCKROOM_ADMIN_PASSCODE:-stockroom-admin}"
    ports: ["127.0.0.1:${MCP_HOST_PORT:-3001}:3001"]
    restart: unless-stopped

  # Commerce MCP server: one shared instance for every host that wants it --
  # the chat below, Claude Desktop, ChatGPT. Sibling of `mcp`, which is the
  # read-only admin server.
  shopping-mcp:
    build: ./mcp-shop
    container_name: "${SHOPPING_MCP_CONTAINER_NAME:-stockroom-shopping-mcp}"
    depends_on:
      api: {condition: service_healthy}
    environment:
      STOCKROOM_API_URL: http://api:8080
      STOCKROOM_PUBLIC_ASSET_URL: "http://127.0.0.1:${API_HOST_PORT:-8080}"
    ports: ["127.0.0.1:${SHOPPING_MCP_HOST_PORT:-3003}:3003"]
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes: ["ollama_data:/root/.ollama"]
    healthcheck:
      test: [CMD, ollama, list]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    profiles: [docker-ollama]

  model-init:
    image: ollama/ollama:latest
    entrypoint: [/bin/sh, /model-init.sh]
    volumes: ["./docker/model-init.sh:/model-init.sh:ro"]
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen3:8b}"
    depends_on:
      ollama: {condition: service_healthy}
    profiles: [docker-ollama]

  # MCP *host*: owns the model loop and the browser session, and is an ordinary
  # client of shopping-mcp. It no longer spawns an MCP server of its own.
  chat:
    build: ./chat-host
    depends_on:
      api: {condition: service_healthy}
      shopping-mcp: {condition: service_healthy}
    environment:
      STOCKROOM_API_URL: http://api:8080
      SHOPPING_MCP_URL: http://shopping-mcp:3003
      # Defaults to an Ollama on the host (Metal GPU). Set OLLAMA_URL to
      # http://ollama:11434 with --profile docker-ollama to keep it in Docker.
      OLLAMA_URL: "${OLLAMA_URL:-http://host.docker.internal:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen3:8b}"
      OLLAMA_TIMEOUT_SECONDS: "${OLLAMA_TIMEOUT_SECONDS:-600}"
      CHAT_SESSION_TTL_SECONDS: "${CHAT_SESSION_TTL_SECONDS:-86400}"
    ports: ["127.0.0.1:${CHAT_HOST_PORT:-3002}:3002"]
    restart: unless-stopped

  # React SPA for the Ollama chat, served by nginx which reverse-proxies /api,
  # /media and /healthz to `chat` so the browser sees one origin -- the session
  # cookie is host-only and tool results carry relative /media paths.
  chat-ui:
    build: ./chat-ui
    depends_on:
      chat: {condition: service_healthy}
    ports: ["127.0.0.1:${CHAT_UI_HOST_PORT:-3004}:8080"]
    restart: unless-stopped

  crawler:
    <<: *crawler
    profiles: [tools]
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}

  # Unit suites live with their service; this one runs only the cross-service
  # end-to-end checks against a stack that is already up.
  test-python:
    build:
      context: .
      dockerfile: docker/e2e.Dockerfile
    profiles: [test]
    environment:
      STOCKROOM_E2E_URL: http://api:8080
      STOCKROOM_CHAT_E2E_URL: http://chat:3002
      SHOPPING_MCP_E2E_URL: http://shopping-mcp:3003/mcp

  test-mcp-shop:
    build:
      context: ./mcp-shop
      dockerfile: Dockerfile.test
    profiles: [test]

  test-chat-host:
    build:
      context: ./chat-host
      dockerfile: Dockerfile.test
    profiles: [test]

  test-crawler:
    build:
      context: .
      dockerfile: crawler/Dockerfile.test
    profiles: [test]

  test-go:
    build:
      context: ./backend-ops
      target: test
    profiles: [test]

volumes:
  raksul_postgres_data:
  raksul_minio_data:
  ollama_data:
